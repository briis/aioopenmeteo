[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aioopenmeteo"
dynamic = ["version"]
description = "Async Python client for the Open-Meteo forecast and air quality APIs, with model selection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarne Riis" }]
keywords = ["open-meteo", "weather", "forecast", "air-quality", "pollen", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
"Source" = "https://github.com/briis/aioopenmeteo"
"Open-Meteo API docs" = "https://open-meteo.com/en/docs"
"Open-Meteo terms" = "https://open-meteo.com/en/terms"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aioopenmeteo.const.__version__" }

[tool.setuptools.package-data]
aioopenmeteo = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aioopenmeteo"]
force-sort-within-sections = true
combine-as-imports = true
